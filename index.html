<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>結婚準備ノート</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* Layout: トップダウンの話し合いノート。左レールは「第1段 方針 → 第2段 ルール → 第3段 数字」。各ページの上に、上の段で決まったことを出す。 */
:root{
  --bg:#f2f4f3; --surface:#ffffff; --sunk:#f7f9f8; --ink:#1c2625; --muted:#63716d; --line:#d9e0dd;
  --accent:#23675f; --accent-ink:#ffffff; --accent-soft:#e1eeeb;
  --ok:#2c7a4c; --ok-soft:#dcf0e3; --warn:#93600a; --warn-soft:#faeed3; --hold:#69716e; --hold-soft:#e9ecea;
  --bad:#b2362d; --bad-soft:#f8e0dd; --self:#5b3f75; --self-soft:#efe7f5;
  --you:#9a5a2c; --you-soft:#f1e2d6; --both:#4f68a8;
  --f-display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121817; --surface:#1a2221; --sunk:#151c1b; --ink:#e4ebe9; --muted:#97a5a1; --line:#2c3836;
  --accent:#6fb9b0; --accent-ink:#0f1d1b; --accent-soft:#1d3532;
  --ok:#7fcf9e; --ok-soft:#1b3326; --warn:#e3b45e; --warn-soft:#382c15; --hold:#a5aeab; --hold-soft:#262d2c;
  --bad:#ef8c82; --bad-soft:#3b211e; --self:#c6a6e2; --self-soft:#2d2440; --you:#e2a77b; --you-soft:#3a2a1f; --both:#9db0e6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121817; --surface:#1a2221; --sunk:#151c1b; --ink:#e4ebe9; --muted:#97a5a1; --line:#2c3836;
  --accent:#6fb9b0; --accent-ink:#0f1d1b; --accent-soft:#1d3532;
  --ok:#7fcf9e; --ok-soft:#1b3326; --warn:#e3b45e; --warn-soft:#382c15; --hold:#a5aeab; --hold-soft:#262d2c;
  --bad:#ef8c82; --bad-soft:#3b211e; --self:#c6a6e2; --self-soft:#2d2440; --you:#e2a77b; --you-soft:#3a2a1f; --both:#9db0e6; color-scheme:dark}
body.self{--accent:var(--self); --accent-soft:var(--self-soft)}

*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.35}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0;flex:1}
.brand h1{font-size:19px;white-space:nowrap}
.mode{font-size:12px;padding:2px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent);white-space:nowrap;font-weight:700}
.saved{font-size:12px;color:var(--muted);white-space:nowrap}
.icon-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 12px;font-size:13px;min-height:40px}
.icon-btn svg{width:16px;height:16px;flex:none}
.icon-btn:hover{border-color:var(--accent)}

/* shell */
.shell{display:grid;grid-template-columns:230px minmax(0,1fr);gap:24px;max-width:1240px;margin:0 auto;padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);align-self:start;display:flex;flex-direction:column;gap:14px}
.rail[hidden]{display:none}
.rail-group{display:flex;flex-direction:column;gap:4px}
.rail-label{font-size:11px;letter-spacing:.06em;color:var(--muted);font-weight:700;padding-left:4px}
.rail-label b{display:inline-block;background:var(--accent-soft);color:var(--accent);border-radius:4px;padding:0 6px;margin-right:6px}
.tab{display:flex;align-items:center;gap:10px;text-align:left;border:0;background:transparent;border-radius:10px;padding:10px 10px;min-height:44px;width:100%}
.tab:hover{background:var(--sunk)}
.tab[aria-current="true"]{background:var(--accent);color:var(--accent-ink)}
.tab .t-name{flex:1;font-weight:500}
.meter{display:flex;gap:2px}
.meter i{width:6px;height:6px;border-radius:2px;background:var(--line)}
.meter i.ok{background:var(--ok)}.meter i.tmp{background:var(--warn)}.meter i.hold{background:var(--hold)}

main{min-width:0}
.topic-head{margin-bottom:16px}
.topic-title{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.topic-head h2{font-size:26px}
.topic-head .when{font-size:12px;color:var(--accent);background:var(--accent-soft);border-radius:99px;padding:2px 10px;font-weight:700}
.lead{color:var(--muted);margin:6px 0 0;max-width:62ch}
.cards{display:flex;flex-direction:column;gap:16px}

/* 上の段のまとめ */
.sumbox{border:1px solid var(--line);border-left:0;background:var(--surface);border-radius:var(--r);padding:12px 16px;margin-bottom:16px;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden}
.sumbox::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--accent)}
.sumbox .sh{font-size:13px;font-weight:700;color:var(--muted)}
.sumbox .known span{font-size:13px;padding:3px 10px}
.sumbox .known span b{font-weight:500;color:var(--muted);margin-right:4px}
.sumbox .none{font-size:13px;color:var(--muted)}
.link{border:0;background:none;color:var(--accent);text-decoration:underline;padding:0;font:inherit;cursor:pointer}

/* question card */
.q{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.q-head{padding:16px 18px 4px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-start}
.q-title{flex:1;min-width:min(260px,100%)}
.q-head > h3{flex:1 1 auto}
.q-head > .hint{flex:0 0 100%;max-width:none;margin-top:-6px}
/* 5つの愛の言語 */
.ll-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
@media (max-width:1100px){ .ll-grid{grid-template-columns:repeat(2,minmax(0,1fr))} .ll:last-child{grid-column:1/-1} }
@media (max-width:560px){ .ll-grid{grid-template-columns:minmax(0,1fr)} }
.ll{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;background:var(--sunk)}
.ll .ll-n{font-family:var(--f-display);font-size:12px;color:var(--accent);font-weight:700}
.ll b{font-family:var(--f-display);font-size:16px}
.ll span{font-size:13px}
.ll small{font-size:12px;color:var(--muted)}
.lo-rank{display:grid;grid-template-columns:3em 8.5em minmax(0,1fr) 3em;gap:8px;align-items:center;font-size:14px;padding:3px 0}
.lo-rank .lo-pos{font-size:12px;color:var(--muted);font-weight:700}
.lo-rank b{text-align:right;font-variant-numeric:tabular-nums}
.lo-edit summary{cursor:pointer;color:var(--accent);font-size:13px;padding:6px 0;min-height:36px;display:flex;align-items:center}
.lo-in{display:grid;grid-template-columns:8.5em 130px;gap:8px;align-items:center;font-size:14px;padding:3px 0}
.lq{padding:10px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.lq-q{font-weight:500}
.ll-res{display:flex;flex-direction:column;gap:6px;padding:6px 0}
.ll-row{display:grid;grid-template-columns:130px minmax(0,1fr) 2em minmax(0,1fr) 2em;gap:10px;align-items:center;font-size:14px}
.ll-row.h{font-size:12px;color:var(--muted);font-weight:700}
.ll-row b{font-variant-numeric:tabular-nums;color:var(--accent)}
.llbar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.llbar i{display:block;height:100%;background:var(--accent)}
.llbar.you i{background:var(--you)}
.llbar.you + b{color:var(--you)}

/* 並行ロードマップ */
table.rm{width:100%;min-width:760px;border-collapse:separate;border-spacing:0;font-size:13px;table-layout:fixed}
.rm th,.rm td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left;line-height:1.5}
.rm thead th{font-size:12px;color:var(--muted);font-weight:700}
.rm th:first-child{width:150px}
.rm .rm-lane{font-weight:700;color:var(--ink);font-size:13px}
.rm td.empty{color:var(--line)}
.rm .now{background:var(--accent-soft)}
.rm thead th.now{color:var(--accent)}
.rm-now{display:inline-block;margin-left:6px;font-size:11px;background:var(--accent);color:var(--accent-ink);border-radius:4px;padding:0 6px}
.rm .ph{font-size:12px;border-bottom:2px solid var(--line);padding-bottom:6px}
.rm .ph1{color:var(--accent);border-bottom-color:var(--accent)}
.rm .ph2{color:var(--you);border-bottom-color:var(--you)}
.rm-notes{margin:4px 0 0;padding-left:1.2em;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}

/* ガント */
.gt{overflow-x:auto;margin:0 -4px;padding:0 4px}
.gt-in{min-width:780px}
.gt-row{display:grid;grid-template-columns:300px minmax(0,1fr);column-gap:12px;align-items:stretch;border-bottom:1px solid var(--line)}
.gt-name{display:flex;gap:10px;align-items:center;min-width:0;padding:4px 0}
.gt-name input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.gt-title{border:0;background:none;text-align:left;padding:6px 0;min-width:0;font-size:14px;line-height:1.45;color:var(--ink);cursor:pointer}
.gt-title:hover{color:var(--accent)}
.gt-title small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.gt-title .late-t{color:var(--bad);font-weight:700}
.gt-title .soon-t{color:var(--warn);font-weight:700}
.gt-track{position:relative;min-height:54px;background-image:linear-gradient(to right,var(--line) 1px,transparent 1px);background-size:10% 100%}
.gt-bar{position:absolute;top:50%;height:14px;margin-top:-7px;border-radius:7px;background:var(--both)}
.gt-bar.me{background:var(--accent)}.gt-bar.you{background:var(--you)}
.gt-row.late .gt-bar{background:var(--bad)}
.gt-row.done .gt-bar{opacity:.28}
.gt-row.done .gt-title{color:var(--muted);text-decoration:line-through}
.gt-today{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--warn);z-index:1}
.gt-p{position:absolute;top:0;bottom:0;width:0;border-left:2px dashed var(--accent);z-index:1}
.gt-head{border-bottom:1px solid var(--line)}
.gt-head .gt-track{min-height:44px}
.gt-weeks{display:grid;grid-template-columns:repeat(10,1fr);font-size:11px;color:var(--muted);padding-top:22px}
.gt-weeks span{padding-left:4px;white-space:nowrap}
.gt-tag{position:absolute;top:2px;transform:translateX(-50%);font-size:11px;font-weight:700;padding:0 6px;border-radius:4px;white-space:nowrap;z-index:2}
.gt-tag.today{background:var(--warn-soft);color:var(--warn)}
.gt-tag.p{background:var(--accent-soft);color:var(--accent)}
.gt-edit{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding:10px 12px;margin:0 0 8px;background:var(--sunk);border:1px solid var(--line);border-radius:10px}
.gt-edit .lbl{font-size:13px;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.gt-foot{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between}
.srow{display:grid;gap:6px;align-items:center;padding:4px 0}
.srow.h{font-size:12px;color:var(--muted);font-weight:700;padding-bottom:0}
select.txt{appearance:auto}
.q-st{flex:none;display:flex;align-items:center;gap:8px}
.q-head h3{font-size:18px}
.q.collapsed .q-head{padding-bottom:8px}
.q.collapsed h3::before{content:"✓";display:inline-block;margin-right:8px;color:var(--ok)}
.q-sum{padding:0 18px 14px;display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.q-sum span{font-size:13px;border-radius:99px;background:var(--ok-soft);color:var(--ok);padding:3px 10px;max-width:100%}
.mini{border:0;background:none;color:var(--accent);font-size:13px;padding:6px 2px;min-height:36px;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.memo-wrap{padding:0 18px 14px;background:var(--sunk)}
.opin{display:grid;grid-template-columns:110px minmax(0,1fr);gap:8px;align-items:center}
.opin .who{font-size:12px}
.opin.concl{padding-top:8px;border-top:1px dashed var(--line)}
.opin.concl .who{color:var(--accent)}
.tagrows{display:flex;flex-direction:column;gap:8px}
.tagrows .opin + .opin{padding-top:8px;border-top:1px dashed var(--line)}
.seg-b.custom{border-style:dashed}
.seg-b.add-chip{border-style:dashed;border-color:var(--accent);color:var(--accent);background:transparent}
.chip-x{display:inline-flex;align-items:center}
.chip-x .x{border:0;background:none;color:var(--muted);min-width:30px;min-height:36px;margin-left:-2px;font-size:15px;border-radius:8px}
.chip-x .x:hover{color:var(--bad);background:var(--bad-soft)}
.add-inline{display:inline-flex;flex-wrap:wrap;gap:6px;align-items:center}
.add-inline .txt{width:220px;max-width:100%;min-height:38px}
.add-inline .btn{min-height:38px;padding:6px 14px}
.other-in{max-width:380px;margin-top:8px;display:block}
.intro{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 18px;margin-bottom:16px;display:flex;flex-direction:column;gap:8px}
.intro ol{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:4px;font-size:14px}
.intro .row-btns{display:flex;justify-content:flex-end}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:22px}
.pager button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:10px 18px;min-height:44px;font-size:14px}
.pager button.next{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);margin-left:auto}
.sm-card{padding:10px 0;border-bottom:1px solid var(--line)}
.sm-card:last-child{border-bottom:0}
.sm-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sm-card ul{margin:6px 0 0;padding-left:1.2em;font-size:14px;display:flex;flex-direction:column;gap:2px}
.sm-tools{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-bottom:16px}
.copybox{width:100%;min-height:220px;font-size:13px}
.hint{color:var(--muted);font-size:13px;margin:4px 0 0;max-width:68ch}
.q-body{padding:12px 18px 16px;display:flex;flex-direction:column;gap:14px}
.q-foot{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:10px 18px;background:var(--sunk);border-top:1px solid var(--line);font-size:13px}
.q-foot .lbl{color:var(--muted)}
.q-foot .at{margin-left:auto;color:var(--muted);font-size:12px}
.q[data-st="ok"]{border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.q[data-st="tmp"]{border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}

/* segmented + chips */
.seg{display:inline-flex;flex-wrap:wrap;gap:6px}
.seg-b{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;min-height:40px;font-size:14px}
.seg-b:hover{border-color:var(--accent)}
.seg-b[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.st .seg-b[data-val="ok"][aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.st .seg-b[data-val="tmp"][aria-pressed="true"]{background:var(--warn);border-color:var(--warn);color:var(--surface)}
.st .seg-b[data-val="hold"][aria-pressed="true"]{background:var(--hold);border-color:var(--hold);color:var(--surface)}
.seg.sm .seg-b{padding:4px 11px;min-height:36px;font-size:13px}
.chip{display:inline-block;font-size:12px;padding:1px 9px;border-radius:99px;background:var(--hold-soft);color:var(--hold);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.tmp{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}.chip.acc{background:var(--accent-soft);color:var(--accent)}

/* inputs */
.num,.txt,.area,.date{border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:8px 10px;min-height:42px;width:100%}
.num{text-align:right;font-variant-numeric:tabular-nums;font-size:16px}
.num:focus,.txt:focus,.area:focus,.date:focus{background:var(--surface);border-color:var(--accent);outline:none}
.area{resize:none;min-height:64px;line-height:1.6;font-size:15px}
.date{width:auto;min-height:36px;padding:4px 8px}
.unit{display:flex;align-items:center;gap:6px}
.unit span{color:var(--muted);font-size:13px;white-space:nowrap}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.field>.flabel{font-size:14px;font-weight:500}
.field .fhint{font-size:12px;color:var(--muted);margin-top:-2px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.who{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.04em}

/* tables */
.tbl-wrap{overflow-x:auto;margin:0 -4px;padding:0 4px}
table.t{width:100%;border-collapse:separate;border-spacing:0;min-width:560px}
.t th{font-size:12px;color:var(--muted);font-weight:700;text-align:right;padding:6px 8px;border-bottom:1px solid var(--line)}
.t th:first-child,.t th.l{text-align:left}
.t td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.t td:first-child{font-size:14px}
.t td.c{width:130px}
.t .sub{display:block;font-size:12px;color:var(--muted)}
.t tr.calc td{background:var(--accent-soft)}
.t tr.calc td:first-child{font-weight:700}
.t tr.total td{border-bottom:0;font-weight:700}
output.v{display:block;text-align:right;font-variant-numeric:tabular-nums;font-size:16px;font-weight:700;color:var(--accent);padding:8px 10px}
output.v.neg{color:var(--bad)}
output.v.empty{color:var(--muted);font-weight:400}
.each{display:block;text-align:right;color:var(--muted);font-size:13px;padding:8px 10px}
.callout{border-radius:10px;background:var(--sunk);border:1px dashed var(--line);padding:10px 12px;font-size:13px;color:var(--muted)}
.callout b{color:var(--ink)}
.result{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:baseline;padding:10px 12px;border-radius:10px;background:var(--accent-soft)}
.result .k{font-size:13px;color:var(--muted)}
.result output{display:inline;font-size:18px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}

/* rows (担当表・家具・家事) */
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:190px minmax(0,1fr);gap:8px 14px;padding:10px 0;border-bottom:1px solid var(--line);align-items:start}
.row:last-child{border-bottom:0}
.row .name{font-weight:500;padding-top:6px}
.row .name small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.row .ctl{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;min-width:0}
.row .ctl .unit{width:150px}
.row .ctl .txt{flex:1;min-width:160px}
.row.off .unit{opacity:.4}

};

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ME = () => S.settings.me || DEF_NAMES.me;
const YOU = () => S.settings.you || DEF_NAMES.you;
const fmt = s => String(s).replace(/\{me\}/g, ME()).replace(/\{you\}/g, YOU());
const lsGet = k => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch(e){ return null; } };
const lsSet = (k,v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch(e){ return false; } };
const topicOf = id => TOPICS.find(t => t.id === id);
if(SOLO) Object.assign(topicOf('summary'), {label:'送る', title:'送る・受け取る', lead:'書けたら、ここから送ります。'});
const cardDef = (t,c) => topicOf(t).cards.find(x => x.id === c);

function card(t,c){
  const T = S.shared[t] || (S.shared[t] = {cards:{}});
  return T.cards[c] || (T.cards[c] = {v:{}, st:'', next:'', at:''});
}
const getV = (t,c,f) => card(t,c).v[f];
function num(x){ if(x===undefined||x===null||x==='') return null; const n=parseFloat(String(x).replace(/,/g,'').replace(/[^\d.\-]/g,'')); return Number.isFinite(n)?n:null; }
function sum(arr){ let any=false, s=0; for(const x of arr){ if(x!==null && x!==undefined){ any=true; s+=x; } } return any ? s : null; }
const N = (t,c,f) => num(getV(t,c,f));
function fmtN(n){ if(n===null||n===undefined) return '—'; return (Math.round(n*10)/10).toLocaleString('ja-JP',{maximumFractionDigits:1}); }

/* ================= ルール → 負担の計算 ================= */
function pctMe(){
  const p = N('mrule','base','pct');
  if(p!==null) return Math.min(100, Math.max(0, p));
  const am=N('money','cap','A.me'), ay=N('money','cap','A.you');
  return (am && ay) ? am/(am+ay)*100 : null;
}
// 'half' | 'ratio' | 'me' | 'you' | 'each' | 'manual'
function effRule(key){
  const r = getV('mrule','items',key);
  if(r && r!=='base') return r;
  const b = getV('mrule','base','how');
  return b==='half' ? 'half' : b==='ratio' ? 'ratio' : 'manual';
}
function ruleText(key){
  const m = effRule(key), viaBase = !getV('mrule','items',key) || getV('mrule','items',key)==='base';
  let s;
  if(m==='half') s='折半';
  else if(m==='ratio'){ const p=pctMe(); s = p===null ? '比率（手取り待ち）' : `比率 ${Math.round(p)}：${100-Math.round(p)}`; }
  else if(m==='me') s=`${ME()}が払う`;
  else if(m==='you') s=`${YOU()}が払う`;
  else if(m==='each') s='各自';
  else s = getV('mrule','base','how')==='fixed' ? '決まった額（手入力）' : '未決定（手入力）';
  return {text:s, base:viaBase, open:m==='manual'};
}
function split(key, total){
  const m = effRule(key);
  if(total===null) return {me:null, you:null, m};
  if(m==='half') return {me:total/2, you:total/2, m};
  if(m==='ratio'){ const p=pctMe(); return p===null ? {me:null,you:null,m} : {me:total*p/100, you:total*(100-p)/100, m}; }
  if(m==='me') return {me:total, you:0, m};
  if(m==='you') return {me:0, you:total, m};
  return {me:null, you:null, m};
}

function compute(){
  const R = {};
  // 毎月
  const shares = {};
  for(const k of MONTHLY){
    const tot = N('money','monthly',k), m = effRule(k);
    let s;
    if(m==='manual') s = {me:N('money','monthly',k+'.me'), you:N('money','monthly',k+'.you'), m};
    else s = split(k, tot);
    shares[k]=s;
    R['m.'+k+'.me']=s.me; R['m.'+k+'.you']=s.you;
  }
  const inF = k => shares[k].m!=='each';
  R['F.me'] = sum(MONTHLY.filter(inF).map(k=>shares[k].me));
  R['F.you'] = sum(MONTHLY.filter(inF).map(k=>shares[k].you));
  R['M.all'] = sum(MONTHLY.map(k=>N('money','monthly',k)));
  for(const who of ['me','you']){
    const A=N('money','cap','A.'+who), B=N('money','cap','B.'+who), C=N('money','cap','C.'+who), D=N('money','cap','D.'+who);
    R['E.'+who] = A===null ? null : A-(B||0)-(C||0)-(D||0);
    R['G.'+who] = (R['E.'+who]===null||R['F.'+who]===null) ? null : R['E.'+who]-R['F.'+who];
  }
  // 最初にかかるお金
  const items = cardDef('furn','items').items;
  R.furn = sum(items.filter(i=>getV('furn','items',i[0]+'.how')==='buy').map(i=>N('furn','items',i[0]+'.budget')));
  const home = cardDef('start','home');
  const homeBase = sum(home.rows.filter(r=>r[3]!=='calc').map(r=>N('start','home',r[0])));
  const reserve = N('start','home','reserve');
  R['home.sub'] = sum([homeBase, R.furn]);
  R['home.cap'] = (R['home.sub']===null && reserve===null) ? null : (R['home.sub']||0)+(reserve||0);
  const wed = cardDef('start','wed');
  const wedBase = sum(wed.rows.filter(r=>r[0]!=='trip').map(r=>N('start','wed',r[0])));
  const tripTot = N('start','wed','trip');
  R['wed.sub'] = sum([wedBase, tripTot]);
  const parts = [['start', sum([homeBase, reserve])], ['furn', R.furn], ['wed', wedBase], ['trip', tripTot]];
  let incomplete = false;
  const need = {me:[], you:[]};
  for(const [k,tot] of parts){
    if(tot===null) continue;
    const s = split(k, tot);
    if(s.me===null){ incomplete = true; continue; }
    need.me.push(s.me); need.you.push(s.you);
  }
  R.needIncomplete = incomplete;
  R['need.me'] = incomplete ? null : sum(need.me);
  R['need.you'] = incomplete ? null : sum(need.you);
  for(const who of ['me','you']){
    const c = N('start','cash','cash.'+who);
    R['cash.diff.'+who] = (c===null||R['need.'+who]===null) ? null : c-R['need.'+who];
  }
  // 家事：時間で重みづけした{me}の割合
  let tw=0, tme=0, hme=0, hyou=0, anyH=false;
  for(const cat of HW_CATS){
    const C = card('hw', cat.id);
    const list = cat.tasks.map(t=>({key:t[0], pct:num(C.v[t[0]+'.pct']), h:num(C.v[t[0]+'.h'])}))
      .concat((C.v.rows||[]).map((r,i)=>({key:'rows.'+i, pct:num(r.pct), h:num(r.h)})));
    let cw=0, cme=0;
    for(const x of list){
      if(x.pct===null) continue;
      R[`hw.${cat.id}.${x.key}.me`] = x.pct; R[`hw.${cat.id}.${x.key}.you`] = 100-x.pct;
      const w = x.h>0 ? x.h : 1;
      cw += w; cme += w*x.pct;
      if(x.h>0){ anyH=true; hme += x.h*x.pct/100; hyou += x.h*(100-x.pct)/100; }
    }
    R['hwc.'+cat.id] = cw ? cme/cw : null;
    tw += cw; tme += cme;
  }
  R['hw.all'] = tw ? tme/tw : null;
  R['hw.hours'] = anyH ? `週あたり ${ME()} ${fmtN(hme)}時間 ／ ${YOU()} ${fmtN(hyou)}時間（時間を入れた家事のみ）` : '週あたりの時間を入れると、時間の合計も出ます';
  R['money.pct'] = (R['F.me']!==null && R['F.you']!==null && R['F.me']+R['F.you']>0) ? R['F.me']/(R['F.me']+R['F.you'])*100 : null;
  return R;
}
function paintCalc(){
  const R = compute();
  document.querySelectorAll('[data-calc]').forEach(el=>{
    const k = el.dataset.calc;
    if(k==='ratio'){ const p=pctMe(); el.textContent = p===null ? '「毎月のお金」で二人の手取りを書くと出ます' : `${ME()} ${Math.round(p)}% ／ ${YOU()} ${100-Math.round(p)}%`; return; }
    if(k==='needNote'){ el.hidden = !R.needIncomplete; return; }
    const v = R[k] ?? null;
    if(typeof v==='string'){ el.textContent = v; return; }
    if(el.dataset.fmt==='pct'){ el.textContent = v===null ? '—' : Math.round(v)+'%'; return; }
    if(el.dataset.fmt==='pair'){ el.textContent = v===null ? 'まだ入っていません' : `${ME()} ${Math.round(v)}% ／ ${YOU()} ${100-Math.round(v)}%`; return; }
    el.textContent = fmtN(v);
    el.classList.toggle('neg', v!==null && v<0);
    el.classList.toggle('empty', v===null);
  });
  document.querySelectorAll('[data-bar]').forEach(el=>{
    const v = R[el.dataset.bar] ?? null;
    el.style.width = (v===null ? 0 : v)+'%';
    el.parentElement.classList.toggle('empty', v===null);
  });
}

/* ================= 描画：部品 ================= */
function kv(k){ const [t,c,f]=k.split('|'); const C=card(t,c); if(f==='@next') return C.next; if(f==='@st') return C.st;
  if(f.startsWith('rows.')){ const [,i,x]=f.split('.'); return (C.v.rows||[])[+i]?.[x] ?? ''; } return C.v[f] ?? ''; }
const numIn = (k, unit='万円', label='') => `<div class="unit"><input class="num" inputmode="decimal" data-k="${k}" value="${esc(kv(k))}" aria-label="${esc(label||unit)}"><span>${esc(unit)}</span></div>`;
const out = k => `<output class="v" data-calc="${k}">—</output>`;
function seg(k, opts, cls=''){
  const cur = kv(k);
  return `<div class="seg ${cls}" role="group">${opts.map(([v,l])=>`<button type="button" class="seg-b" data-pick="${k}" data-val="${v}" aria-pressed="${cur===v}">${esc(fmt(l))}</button>`).join('')}</div>`;
}
const area = (k, ph='', label='') => `<textarea class="area" rows="2" data-k="${k}" placeholder="${esc(ph)}" aria-label="${esc(label)}">${esc(kv(k))}</textarea>`;
const txt = (k, ph='') => `<input class="txt" data-k="${k}" value="${esc(kv(k))}" placeholder="${esc(ph)}">`;

// 案のチップ。base.me / base.you（二人で選ぶ案は base）に選択を配列で持つ。
// 「＋ その他」で足した案は base.x に文字列で持ち、値は 'x:' + 文字列
const allTags = (K, base, tags) => tags.concat((kv(K(base+'.x')) || []).map(l => ['x:'+l, l, true]));
function tagState(K, base, tags){
  const all = allTags(K, base, tags), a = kv(K(base+'.me')) || [], b = kv(K(base+'.you')) || [];
  const lab = arr => all.filter(([v]) => arr.includes(v)).map(([,l]) => l);
  return {me:lab(a), you:lab(b), both:all.filter(([v]) => a.includes(v) && b.includes(v)).map(([,l]) => l)};
}
const tagBoth = (K, fd) => tagState(K, fd.f, fd.tags).both;
function chipBtns(key, all, ck, sels){
  const cur = kv(key) || [];
  const chips = all.map(([v,l,custom]) => {
    const btn = `<button type="button" class="seg-b${custom?' custom':''}" data-tag="${key}" data-val="${esc(v)}" aria-pressed="${cur.includes(v)}">${esc(l)}</button>`;
    return custom ? `<span class="chip-x">${btn}<button type="button" class="x" data-act="tagdel" data-ck="${ck}" data-label="${esc(l)}" data-sels="${sels}" aria-label="「${esc(l)}」を消す">×</button></span>` : btn;
  }).join('');
  const add = S.adding===key
    ? `<span class="add-inline"><input class="txt" id="addin" data-row="${key}" data-ck="${ck}" maxlength="30" placeholder="自分の言葉で" aria-label="その他の案"><button type="button" class="btn pri" data-act="tagaddok">追加</button><button type="button" class="mini" data-act="tagaddcancel">やめる</button></span>`
    : `<button type="button" class="seg-b add-chip" data-act="tagadd" data-row="${key}">＋ その他</button>`;
  return `<div class="seg" role="group">${chips}${add}</div>`;
}
function tagRows(K, base, tags){
  const all = allTags(K, base, tags), ck = K(base+'.x'), sels = [K(base+'.me'), K(base+'.you')].join(',');
  if(SOLO) return `<div class="seg sm tagrows">${chipBtns(K(base+'.you'), all, ck, sels)}</div>`;
  const both = tagState(K, base, tags).both;
  return `<div class="seg sm tagrows">
      <div class="opin"><span class="who">${esc(ME())}</span>${chipBtns(K(base+'.me'), all, ck, sels)}</div>
      <div class="opin"><span class="who">${esc(YOU())}</span>${chipBtns(K(base+'.you'), all, ck, sels)}</div></div>
    <div class="result"><span class="k">二人とも選んだもの</span><span>${both.length?esc(both.join('・')):'—'}</span></div>`;
}
const multiRow = (K, base, tags) => `<div class="seg sm">${chipBtns(K(base), allTags(K, base, tags), K(base+'.x'), K(base))}</div>`;
const multiLabels = (K, base, tags) => { const sel = kv(K(base)) || []; return allTags(K, base, tags).filter(([v]) => sel.includes(v)).map(([,l]) => l); };

// 1つ選ぶ質問の「その他」：値 'other' と、key + '.other' に中身
const OTHER = ['other','その他'];
function segOther(key, opts, cls=''){
  return `${seg(key, [...opts, OTHER], cls)}${kv(key)==='other' ? `<input class="txt other-in" data-k="${key}.other" value="${esc(kv(key+'.other'))}" placeholder="その他の内容" aria-label="その他の内容">` : ''}`;
}
function optLabel(opts, val, otherText){
  if(val==='other') return otherText ? `その他（${otherText}）` : 'その他';
  const o = opts.find(x => x[0]===val); return o ? fmt(o[1]) : '';
}
function formField(K, fd){
  const lab = fd.l ? `<span class="flabel">${esc(fmt(fd.l))}</span>` : '';
  const hint = fd.fhint ? `<span class="fhint">${esc(fmt(fd.fhint))}</span>` : '';
  if(SOLO && !K('').startsWith('propose|')){
    // {you}版：{you}の欄だけ。二人で決める欄（結論・金額・補足）は出さない
    if(fd.opts && !fd.noSplit) return `<div class="field">${lab}<div>${segOther(K(fd.f+'.you'), fd.opts)}</div>${hint}</div>`;
    if(fd.tags) return `<div class="field">${lab}${tagRows(K, fd.f, fd.tags)}</div>`;
    if(fd.pair) return `<div class="field">${lab}${fd.sugg?`${tagRows(K, fd.f+'.t', fd.sugg)}<span class="fhint">ほかにあれば・くわしく</span>`:''}${area(K(fd.f+'.you'), fd.ph||'', YOU())}</div>`;
    return '';
  }
  if(fd.calc==='ratio') return `<div class="result"><span class="k">手取りの比率だと</span><output data-calc="ratio"></output></div>`;
  if(fd.opts){
    // 「二人の意見が違う」を開くと、それぞれの考え＋二人の結論の3段になる
    if(fd.noSplit) return `<div class="field">${lab}<div>${segOther(K(fd.f), fd.opts)}</div>${hint}</div>`;
    const key = K(fd.f), shown = S.split[key] ?? !!(kv(K(fd.f+'.me')) || kv(K(fd.f+'.you')));
    const body = shown
      ? `<div class="opin"><span class="who">${esc(ME())}の考え</span><div>${segOther(K(fd.f+'.me'), fd.opts, 'sm')}</div></div>
         <div class="opin"><span class="who">${esc(YOU())}の考え</span><div>${segOther(K(fd.f+'.you'), fd.opts, 'sm')}</div></div>
         <div class="opin concl"><span class="who">二人の結論</span><div>${segOther(key, fd.opts)}</div></div>`
      : segOther(key, fd.opts);
    return `<div class="field">${lab}${body}${hint}
      <div><button type="button" class="mini" data-act="split" data-key="${key}" data-shown="${shown?1:0}">${shown?'それぞれの考えの欄を閉じる':'二人の意見が違う'}</button></div></div>`;
  }
  if(fd.tags) return `<div class="field">${lab}${tagRows(K, fd.f, fd.tags)}</div>`;
  if(fd.num) return `<div class="field">${lab}<div style="max-width:240px">${numIn(K(fd.f), fd.num, fmt(fd.l))}</div>${hint}</div>`;
  if(fd.pair){
    // 案（それぞれ選ぶ）→ 足りない分を文章で
    const sugg = fd.sugg ? `${tagRows(K, fd.f+'.t', fd.sugg)}<span class="fhint">ほかにあれば・くわしく</span>` : '';
    return `<div class="field">${lab}${sugg}<div class="grid2">
      <div class="field"><span class="who">${esc(ME())}</span>${area(K(fd.f+'.me'),fd.ph||'',ME())}</div>
      <div class="field"><span class="who">${esc(YOU())}</span>${area(K(fd.f+'.you'),fd.ph||'',YOU())}</div></div></div>`;
  }
  if(fd.text){
    // 案（二人で選ぶ）→ 補足を文章で
    const multi = fd.multi ? `${multiRow(K, fd.f+'.t', fd.multi)}<span class="fhint">ほかにあれば・くわしく</span>` : '';
    return `<div class="field">${lab}${multi}${area(K(fd.f), fd.ph||'', fmt(fd.l))}${hint}</div>`;
  }
  return '';
}

/* ---------- 5つの愛の言語 ---------- */
const zeroLang = () => Object.fromEntries(LANGS.map(l => [l.id, 0]));
function quizScore(who){
  const c = zeroLang(); let n = 0;
  LOVE_Q.forEach((x,i) => { const a = getV('love','quiz',`q${i}.${who}`); if(a){ n++; c[(a==='a'?x.a:x.b)[0]]++; } });
  return {c, n};
}
// 公式診断の割合。書き換えていなければ初期値（空にしたら「なし」）
function offPct(who, id){
  const v = getV('love','official',`pct.${who}.${id}`);
  return v !== undefined ? num(v) : (OFFICIAL_SEED[who]?.[id] ?? null);
}
const hasOfficial = who => LANGS.some(l => offPct(who, l.id) !== null);
// 受け取り方：ミニ診断＋「嬉しいこと」の案＋公式診断（30%≒ミニ診断の満点4点）
function receiveScore(who){
  const c = quizScore(who).c;
  for(const id of getV('love','talk',`receive.t.${who}`) || []){ const l = id.split(':')[0]; if(l in c) c[l]++; }
  for(const l of LANGS){ const p = offPct(who, l.id); if(p !== null) c[l.id] += p/7.5; }
  return c;
}
function officialRank(who){
  return LANGS.map(l => ({...l, p:offPct(who, l.id)})).filter(x => x.p !== null).sort((a,b) => b.p - a.p);
}
function expressScore(who){
  const c = zeroLang();
  for(const id of getV('love','talk',`express.t.${who}`) || []){ const l = id.split(':')[0]; if(l in c) c[l]++; }
  return c;
}
const topLangs = c => { const m = Math.max(...Object.values(c)); return m > 0 ? LANGS.filter(l => c[l.id]===m).map(l => l.id) : []; };
const langNames = ids => ids.map(id => `「${LANG[id].n}」`).join('');
function loveInsights(){
  return [['me','you'],['you','me']].map(([g, r]) => {
    const G = g==='me'?ME():YOU(), Rn = r==='me'?ME():YOU();
    const rt = topLangs(receiveScore(r)), gt = topLangs(expressScore(g));
    const lines = rt.length ? [`${Rn}は${langNames(rt)}で大切にされていると感じやすいかも`, ...rt.map(id => `ヒント：${LANG[id].tip}`)] : [];
    const gap = (rt.length && gt.length && !gt.some(x => rt.includes(x)))
      ? `${G}は${langNames(gt)}で伝えがち。${Rn}には${langNames(rt)}も添えると届きやすそう` : '';
    return {title:`${Rn}に伝わりやすいこと`, lines, gap};
  });
}

/* ---------- カードの中身を短い文に（たたんだ表示・まとめ・コピー用） ---------- */
const ST_LABEL = {ok:'決定', tmp:'仮', hold:'保留', '':'まだ'};
const short = (s, n=60) => { s = String(s).replace(/\s+/g,' ').trim(); return s.length>n ? s.slice(0,n)+'…' : s; };
function tagLines(L, name, st){
  if(st.both.length) L.push(`${name}（二人とも）：${st.both.join('・')}`);
  if(st.me.length || st.you.length) L.push(`${name}：${ME()}「${st.me.join('・')||'—'}」／${YOU()}「${st.you.join('・')||'—'}」`);
}
function cardLines(t, c, R){
  const v = card(t,c.id).v, L = [];
  const optL = (opts,val) => { const o = opts.find(x=>x[0]===val); return o ? fmt(o[1]) : ''; };
  const K = f => `${t}|${c.id}|${f}`;
  switch(c.type){
    case 'form':
      for(const fd of c.fields){
        const name = fd.l ? cleanL(fd.l) : fmt(c.title);
        if(fd.opts){
          const m = optLabel(fd.opts, v[fd.f], v[fd.f+'.other']), a = optLabel(fd.opts, v[fd.f+'.me'], v[fd.f+'.me.other']), b = optLabel(fd.opts, v[fd.f+'.you'], v[fd.f+'.you.other']);
          if(m) L.push(`${name}：${m}`);
          if((a||b) && !(a===m && b===m)) L.push(`${name}（それぞれ）：${ME()}「${a||'—'}」／${YOU()}「${b||'—'}」`);
        } else if(fd.tags){
          tagLines(L, name, tagState(K, fd.f, fd.tags));
        } else if(fd.num){ if(num(v[fd.f])!==null) L.push(`${name}：${v[fd.f]}${fd.num}`); }
        else if(fd.pair){
          if(fd.sugg) tagLines(L, name, tagState(K, fd.f+'.t', fd.sugg));
          const a=v[fd.f+'.me'], b=v[fd.f+'.you'];
          if(a||b) L.push(`${name}${fd.sugg?'（くわしく）':''}：${ME()}「${short(a||'—')}」／${YOU()}「${short(b||'—')}」`);
        }
        else if(fd.text){
          if(fd.multi){ const sel = multiLabels(K, fd.f+'.t', fd.multi); if(sel.length) L.push(`${name}：${sel.join('・')}`); }
          if(v[fd.f]) L.push(`${name}${fd.multi?'（くわしく）':''}：${short(v[fd.f],80)}`);
        }
      }
      break;
    case 'grid':
      for(const r of c.rows){ if(!Array.isArray(r)) continue; const o = optL(c.opts, v[r[0]]); if(o) L.push(`${fmt(r[1])}：${o}`); }
      break;
    case 'checks': { const n = c.items.filter(i=>v[i[0]]).length; if(n) L.push(`${n} / ${c.items.length} 確認済み`); break; }
    case 'change':
      if(num(v.months)!==null) L.push(`緊急資金：生活費の${v.months}か月分`);
      if(v.order) L.push(`見直す順番：${short(v.order,80)}`);
      break;
    case 'monthly':
      for(const k of MONTHLY){
        const tot = num(v[k]); if(tot===null) continue;
        const def = RULE_ROWS.find(r=>r[0]===k), me = R[`m.${k}.me`], you = R[`m.${k}.you`];
        L.push(`${def[1]} ${fmtN(tot)}万円（${ruleText(k).text}）${me!=null&&you!=null?` → ${ME()} ${fmtN(me)}万／${YOU()} ${fmtN(you)}万`:''}`);
      }
      if(R['F.me']!=null) L.push(`毎月の負担：${ME()} ${fmtN(R['F.me'])}万円／${YOU()} ${fmtN(R['F.you'])}万円`);
      break;
    case 'cap': if(R['G.me']!=null || R['G.you']!=null) L.push(`残る余裕：${ME()} ${fmtN(R['G.me'])}万円／${YOU()} ${fmtN(R['G.you'])}万円`); break;
    case 'single':
      if(R[c.id+'.sub']!=null) L.push(`${c.subtotal}：${fmtN(R[c.id+'.sub'])}万円`);
      if(c.reserve && R['home.cap']!=null) L.push(`新居準備の上限：${fmtN(R['home.cap'])}万円`);
      break;
    case 'cash':
      if(R['need.me']!=null) L.push(`負担する額：${ME()} ${fmtN(R['need.me'])}万円／${YOU()} ${fmtN(R['need.you'])}万円`);
      if(R['cash.diff.me']!=null || R['cash.diff.you']!=null) L.push(`出せる現金との差：${ME()} ${fmtN(R['cash.diff.me'])}万円／${YOU()} ${fmtN(R['cash.diff.you'])}万円`);
      break;
    case 'pay': for(const r of (v.rows||[])) if(r.item) L.push(`${r.item}${r.month?`（${r.month}）`:''}${r.amt?` ${r.amt}万円`:''}${r.bearer?` 負担：${r.bearer}`:''}`); break;
    case 'furniture': {
      const g = {me:[], you:[], buy:[], later:[]};
      for(const [f,l] of c.items){ const h = v[f+'.how']; if(g[h]) g[h].push(l + (h==='buy' && num(v[f+'.budget'])!==null ? `（${v[f+'.budget']}万）` : '')); }
      if(g.buy.length) L.push(`買う：${g.buy.join('、')}（合計 ${fmtN(R.furn)}万円）`);
      if(g.me.length) L.push(`${ME()}が持参：${g.me.join('、')}`);
      if(g.you.length) L.push(`${YOU()}が持参：${g.you.join('、')}`);
      if(g.later.length) L.push(`後回し：${g.later.join('、')}`);
      break;
    }
    case 'lovequiz': {
      for(const who of ['me','you']){
        const s = quizScore(who); if(!s.n) continue;
        L.push(`ミニ診断（${s.n}/10問）：${who==='me'?ME():YOU()}は${langNames(topLangs(s.c))}が高め`);
      }
      break;
    }
    case 'loveofficial': {
      for(const who of ['me','you']){
        const r = officialRank(who); if(!r.length) continue;
        L.push(`公式診断：${who==='me'?ME():YOU()}は ${r.map(x=>`${x.n}${x.p}%`).join('・')}`);
      }
      const a = v['fit.me'], b = v['fit.you'];
      if(a||b) L.push(`当たってる？：${ME()}「${short(a||'—')}」／${YOU()}「${short(b||'—')}」`);
      break;
    }
    case 'lovegap': loveInsights().forEach(b => { if(b.lines[0]) L.push(b.lines[0]); if(b.gap) L.push(b.gap); }); break;
    case 'hwsum': if(R['hw.all']!=null) L.push(`家事全体：${ME()} ${Math.round(R['hw.all'])}%／${YOU()} ${100-Math.round(R['hw.all'])}%`); break;
    case 'hwcat': {
      const cat = HW_CATS.find(x=>x.id===c.id);
      cat.tasks.map(([id,l])=>[l, num(v[id+'.pct'])]).concat((v.rows||[]).map(r=>[r.name||'（名前なし）', num(r.pct)]))
        .filter(x=>x[1]!==null).forEach(([l,p]) => L.push(`${l}：${ME()} ${p}%／${YOU()} ${100-p}%`));
      break;
    }
  }
  if(v._memo) L.push(`メモ：${short(v._memo,100)}`);
  return L;
}

function summaryData(){

function decidedIn(tid, onlyCards){
  const T = topicOf(tid), out = [];
  for(const c of T.cards){
    if(onlyCards && !onlyCards.includes(c.id)) continue;
    if(c.type==='form'){
      for(const fd of c.fields){
        const v = getV(tid,c.id,fd.f);
        if(fd.opts && v){ const o = optLabel(fd.opts, v, getV(tid,c.id,fd.f+'.other')); if(o) out.push([fmt(fd.l||c.title), o]); }
        else if(fd.num && num(v)!==null) out.push([fmt(fd.l), `${v}${fd.num}`]);
        else if(fd.tags){ const b = tagBoth(f=>`${tid}|${c.id}|${f}`, fd); if(b.length) out.push([cleanL(fd.l)+'（二人とも）', b.join('・')]); }
        else if(fd.pair && fd.sugg){ const b = tagState(f=>`${tid}|${c.id}|${f}`, fd.f+'.t', fd.sugg).both; if(b.length) out.push([cleanL(fd.l)+'（二人とも）', b.join('・')]); }
        else if(fd.text && fd.multi){ const sel = multiLabels(f=>`${tid}|${c.id}|${f}`, fd.f+'.t', fd.multi); if(sel.length) out.push([cleanL(fd.l), sel.join('・')]); }
      }
    } else if(c.type==='grid'){
      for(const r of c.rows){ if(!Array.isArray(r)) continue; const v=getV(tid,c.id,r[0]); if(!v) continue;
        const o=c.opts.find(x=>x[0]===v); if(o) out.push([fmt(r[1]), fmt(o[1])]); }
    }
  }
  return out;
}

function topicCounts(t){
  const T = topicOf(t); const r={ok:0,tmp:0,hold:0,none:0,total:T.cards.length};

function renderGantt(){

    return `<div class="gt-row ${x.done?'done':''} ${late?'late':''}">

  }).join('');

const soloCard = (t, c) => t==='propose' || c.type==='loveofficial'
  || (c.type==='form' && c.fields.some(fd => fd.tags || fd.pair || (fd.opts && !fd.noSplit)));
// {you}版で出すページ。一人で考えてほしいところだけに絞る（多いと身構えてしまうので）
const SOLO_TOPICS = ['couple','vision','love','fun','propose','summary'];
const TOPS = () => SOLO ? TOPICS.filter(t => SOLO_TOPICS.includes(t.id)) : TOPICS;
function ownedByYou(t, c, f){
  if(t==='flow'){
    const id = f.replace(/\.done$/, ''), x = FLOW_TASKS.find(y => y.id===id);
    return c==='tasks' && f.endsWith('.done') && !!x && (card('flow','tasks').v[id+'.who'] || x.who)==='you';
  }
  const d = topicOf(t)?.cards.find(x => x.id===c);
  if(!d || !soloCard(t, d)) return false;
  return t==='propose' || /(^|\.)you(\.|$)/.test(f) || /\.x$/.test(f);
}
const okVal = x => ['string','number','boolean'].includes(typeof x) || (Array.isArray(x) && x.every(y => typeof y==='string'));
function exportYou(){
  const d = {};
  for(const [t, T] of Object.entries(S.shared)) for(const [c, C] of Object.entries(T.cards || {}))
    for(const [f, val] of Object.entries(C.v || {}))
      if(ownedByYou(t, c, f) && okVal(val)) (d[t+'|'+c] ||= {})[f] = [val, C.ts?.[f] || 0];
  return `結婚準備ノート（${SOLO ? YOU() : ME()}から）\nKN1 ${JSON.stringify({from:EDITION, d})}`;
}
// 戻り値：反映した数。読めなければ null
function importYou(text){
  const m = /KN1\s+(\{[\s\S]*\})\s*$/.exec(text.trim());
  let p = null; try{ p = m && JSON.parse(m[1]); }catch(e){}
  if(!p || !p.d || typeof p.d!=='object') return null;
  let n = 0;
  for(const [tc, fields] of Object.entries(p.d)){
    const [t, c] = tc.split('|');
    if(!fields || typeof fields!=='object' || (t!=='flow' && !topicOf(t)?.cards.some(x => x.id===c))) continue;
    for(const [f, pr] of Object.entries(fields)){
      if(!Array.isArray(pr) || !okVal(pr[0]) || !ownedByYou(t, c, f)) continue;
      const C = card(t, c), val = pr[0], ts = +pr[1] || 0, lt = C.ts?.[f] || 0, cur = C.v[f];
      if(f.endsWith('.x') && Array.isArray(val)){  // 自分で足した案は両方を残す
        const u = [...new Set([...(cur || []), ...val])]; if(u.length !== (cur || []).length){ C.v[f] = u; n++; } continue;
      }
      if(ts > lt || cur===undefined){
        if(JSON.stringify(cur) !== JSON.stringify(val)){ C.v[f] = val; n++; }
        (C.ts ||= {})[f] = Math.max(ts, lt);
      }
    }
  }
  if(n) saveShared();
  return n;
}

}

const DOW='日月火水木金土';
function parseD(s){ const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||''); return m?new Date(+m[1],+m[2]-1,+m[3]):null; }
function today0(){ const d=new Date(); return new Date(d.getFullYear(),d.getMonth(),d.getDate()); }
function dueOf(x){ if(x.abs) return parseD(x.abs); const p=parseD(S.self.pdate); if(!p||x.rel===undefined) return null; const d=new Date(p); d.setDate(d.getDate()+x.rel); return d; }
function dueChip(d, done){
  if(!d) return '';
  const lbl = `${d.getMonth()+1}/${d.getDate()}（${DOW[d.getDay()]}）`;
  if(done) return `<span class="chip ok">完了</span><span>${lbl}</span>`;
  const diff = Math.round((d - today0())/86400000);
  if(diff<0) return `<span class="chip bad">${-diff}日過ぎ</span><span>${lbl}</span>`;
  if(diff===0) return `<span class="chip bad">今日まで</span><span>${lbl}</span>`;
  if(diff<=7) return `<span class="chip tmp">あと${diff}日</span><span>${lbl}</span>`;
  return `<span class="chip">${lbl}まで</span>`;
}

function closeOverlay(){ document.getElementById('overlay').innerHTML=''; }


/* ================= 呼び方 ================= */
document.getElementById('btnNames').addEventListener('click', ()=>{
  document.getElementById('overlay').innerHTML = `<div class="ov" role="dialog" aria-modal="true" aria-label="呼び方"><form class="sheet" id="namesForm">
    <h3>呼び方</h3><p>表の見出しや担当の選択肢に使います。</p>
    <div class="field"><label for="nmMe">自分</label><input class="txt" id="nmMe" value="${esc(S.settings.me)}"></div>
    <div class="field"><label for="nmYou">お相手</label><input class="txt" id="nmYou" value="${esc(S.settings.you)}"></div>
    <div class="row-btns"><button type="button" class="btn" id="nmCancel">やめる</button><button type="submit" class="btn pri">変更する</button></div>
  </form></div>`;
  document.getElementById('nmCancel').onclick = closeOverlay;
  document.getElementById('namesForm').onsubmit = ev => { ev.preventDefault();
    S.settings.me = document.getElementById('nmMe').value.trim() || DEF_NAMES.me;
    S.settings.you = document.getElementById('nmYou').value.trim() || DEF_NAMES.you;
    saveSettings(); closeOverlay(); render(); };
});

/* ================= 起動 ================= */
(function boot(){
  const cached = lsGet(LS+'shared'); if(cached && typeof cached==='object') S.shared = cached;
  const st = lsGet(LS+'settings'); if(st) Object.assign(S.settings, st);
  const self = lsGet(LS+'self-local'); if(self) Object.assign(S.self, self);
  const tab = lsGet(LS+'tab'); if(tab && topicOf(tab)) S.topic = tab;
  // 以前のチェックを、二人用のやることへ引き継ぐ
  const tv = card('flow','tasks').v;
  
  render();
  status('この端末にだけ保存されます');
})();
})();
</script>

</body>
</html>
